<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burger Menu</title>
<style>
  :root {
    --bg: #fdfdfd;
    --olive: #646752;
    --on-olive: #ffffff;
    --morph: 520ms;
    --fade: 300ms;
    --ease: cubic-bezier(0.6, 0, 0.3, 1);
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--olive);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body.slow { --morph: 2080ms; --fade: 1200ms; }
  body.menu-open { overflow: hidden; }

  header {
    position: fixed; inset: 0 0 auto 0; z-index: 2;
    display: flex; align-items: center;
    padding: 24px clamp(16px, 5vw, 64px);
    pointer-events: none;
  }

  /* --- Burger --------------------------------------------------------- */
  .burger {
    pointer-events: auto;
    appearance: none; border: 0; background: none; padding: 8px; margin: -8px;
    cursor: pointer;
    color: var(--olive);
    -webkit-tap-highlight-color: transparent;
  }
  .burger:focus-visible { outline: 1.5px dashed currentColor; outline-offset: 4px; }
  .menu-open .burger { color: var(--on-olive); }
  .burger svg { display: block; width: 52px; height: auto; overflow: visible; }
  /* Each line is one long path: the visible dash slides along it. Closed, the
     dash covers the straight bar at the start; open, it covers the diagonal at
     the end, so the line curls round the right-hand loop to get there. */
  .burger path {
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-dasharray: var(--c-len) 9999;
    stroke-dashoffset: var(--c-off);
    transition:
      stroke-dasharray var(--morph) var(--ease),
      stroke-dashoffset var(--morph) var(--ease);
  }
  .menu-open .burger path {
    stroke-dasharray: var(--o-len) 9999;
    stroke-dashoffset: var(--o-off);
  }

  /* --- Panel ---------------------------------------------------------- */
  .panel {
    position: fixed; inset: 0; z-index: 1;
    background: var(--olive);
    color: var(--on-olive);
    opacity: 0; visibility: hidden;
    transition: opacity var(--fade) linear, visibility 0s linear var(--fade);
    overflow-y: auto;
  }
  .menu-open .panel {
    opacity: 1; visibility: visible;
    transition: opacity var(--fade) linear, visibility 0s;
  }
  .panel ul {
    list-style: none; margin: 0;
    padding: 140px clamp(16px, 5vw, 64px) 48px;
  }
  .panel a {
    display: inline-block;
    color: inherit; text-decoration: none;
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 300;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .panel a:hover, .panel a:focus-visible { opacity: .7; outline: none; }

  /* --- Page ----------------------------------------------------------- */
  main {
    min-height: 100%;
    display: grid; place-items: center;
    padding: 120px 16px 48px; box-sizing: border-box;
    text-align: center;
  }
  main p { margin: 0 0 12px; opacity: .75; }
  label { font-size: 14px; opacity: .75; cursor: pointer; user-select: none; }

  @media (prefers-reduced-motion: reduce) {
    :root { --morph: 0ms; --fade: 0ms; }
  }
</style>
</head>
<body>
<header>
  <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
    <svg viewBox="36 6 122 116" aria-hidden="true">
      <!-- top bar → loops down the right side → diagonal from bottom-right to top-left -->
      <path id="lineTop" d="M40 34 H126 C144 34 152 48 152 66 C152 88 138 118 122 102 L46 26"/>
      <path id="lineMid" d="M40 64 H126"/>
      <!-- bottom bar → loops up the right side → diagonal from top-right to bottom-left -->
      <path id="lineBot" d="M40 94 H126 C144 94 152 80 152 62 C152 40 138 10 122 26 L46 102"/>
    </svg>
  </button>
</header>

<nav class="panel" id="menu" aria-label="Main">
  <ul>
    <li><a href="#">About ER</a></li>
    <li><a href="#">Our segments</a></li>
    <li><a href="#">Investors</a></li>
    <li><a href="#">Sustainability</a></li>
    <li><a href="#">Newsroom</a></li>
    <li><a href="#">Careers</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <div>
    <p>Click the burger, or press Esc to close.</p>
    <label><input type="checkbox" id="slow"> Slow motion (4×)</label>
  </div>
</main>

<script>
  const BAR = 86;                         // length of a straight bar
  const DIAG = Math.hypot(76, 76);        // length of one arm of the X

  // Closed: dash = the bar at the start of the path.
  // Open: dash = the diagonal at the end of the path.
  for (const id of ['lineTop', 'lineBot']) {
    const p = document.getElementById(id);
    const total = p.getTotalLength();
    p.style.setProperty('--c-len', BAR);
    p.style.setProperty('--c-off', 0);
    p.style.setProperty('--o-len', DIAG);
    p.style.setProperty('--o-off', -(total - DIAG));
  }
  // The middle bar shrinks to nothing just left of centre, where the X crosses.
  const mid = document.getElementById('lineMid');
  mid.style.setProperty('--c-len', BAR);
  mid.style.setProperty('--c-off', 0);
  mid.style.setProperty('--o-len', 0);
  mid.style.setProperty('--o-off', -44);

  const btn = document.querySelector('.burger');
  const panel = document.getElementById('menu');

  function setOpen(open) {
    document.body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    panel.inert = !open;
  }
  panel.inert = true;

  btn.addEventListener('click', () => setOpen(!document.body.classList.contains('menu-open')));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('menu-open')) {
      setOpen(false);
      btn.focus();
    }
  });
  panel.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });

  document.getElementById('slow').addEventListener('change', e => {
    document.body.classList.toggle('slow', e.target.checked);
  });
</script>
</body>
</html>
