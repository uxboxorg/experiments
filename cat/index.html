<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Cat</title>
<style>
  :root { --bg: #ffffff; --ink: #000000; --hint: #8a8a8a; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--hint);
    overflow: hidden;
  }
  .stage { width: min(92vw, 900px); padding: 0 16px; box-sizing: border-box; text-align: center; }
  svg { width: 100%; height: auto; display: block; cursor: pointer; touch-action: manipulation; }
  svg:focus-visible { outline: 2px dashed var(--hint); outline-offset: 8px; }
  .ink { fill: var(--ink); }
  .eye { fill: var(--bg); }
  p { margin: 16px 0 0; user-select: none; }
</style>
</head>
<body>
<div class="stage">
  <svg id="cat" viewBox="-10 50 1300 920" role="img" tabindex="0"
       aria-label="Black geometric cat. Move the pointer to wake it, click, hold, or press Enter to pet it.">
    <defs>
      <clipPath id="ground"><rect x="-500" y="-500" width="2400" height="1445"/></clipPath>
      <clipPath id="lidL"><path id="lidLPath"/></clipPath>
      <clipPath id="lidR"><path id="lidRPath"/></clipPath>
    </defs>
    <g clip-path="url(#ground)">
      <path id="tail" class="ink"/>
      <path id="body" class="ink"/>
      <g id="eyeL"><g clip-path="url(#lidL)">
        <circle class="eye" cx="745" cy="658" r="121"/>
      </g></g>
      <g id="eyeR"><g clip-path="url(#lidR)">
        <circle class="eye" cx="1014" cy="658" r="100"/>
      </g></g>
    </g>
  </svg>
  <p>Move your pointer to wake the cat · click or hold to pet</p>
</div>

<script>
(() => {
  const svg = document.getElementById('cat');
  const tailEl = document.getElementById('tail');
  const bodyEl = document.getElementById('body');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Geometry traced from the logo (viewBox units) ----
  // Tail spine from the ground up to the centre of the rounded tip, with widths.
  // The visible tail is one constant thickness; it only flares below the joint,
  // where it merges into the body, so the silhouette still meets the ground.
  const TAIL_W = 100;
  const SPINE  = [[207,945],[207,870],[212,760],[235,640],[275,540],[320,440],[338,330],[312,240],[275,172]];
  const WIDTHS = [130, 130, TAIL_W, TAIL_W, TAIL_W, TAIL_W, TAIL_W, TAIL_W, TAIL_W];

  // Unit normal at each point of a polyline (from its neighbours).
  const normalsOf = pts => pts.map((p, i) => {
    const q0 = pts[Math.max(i - 1, 0)], q1 = pts[Math.min(i + 1, pts.length - 1)];
    const tx = q1[0] - q0[0], ty = q1[1] - q0[1], l = Math.hypot(tx, ty) || 1;
    return [-ty / l, tx / l];
  });

  // Resting tail, smoothed once with Catmull-Rom: points, widths, normals and
  // arc-length position s (0 at the ground, 1 at the tip).
  const REST = [], REST_W = [], STEPS = 10;
  for (let i = 0; i < SPINE.length - 1; i++) {
    const p0 = SPINE[Math.max(i - 1, 0)], p1 = SPINE[i], p2 = SPINE[i + 1], p3 = SPINE[Math.min(i + 2, SPINE.length - 1)];
    for (let k = 0; k < STEPS; k++) {
      const u = k / STEPS, u2 = u * u, u3 = u2 * u;
      const cr = j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3);
      REST.push([cr(0), cr(1)]);
      REST_W.push(WIDTHS[i] + (WIDTHS[i + 1] - WIDTHS[i]) * u);
    }
  }
  REST.push(SPINE[SPINE.length - 1]);
  REST_W.push(WIDTHS[WIDTHS.length - 1]);
  // Relax the curve and the width profile so the outline has no corners at the
  // traced points (uneven spacing and slope changes). Ends stay pinned.
  for (let pass = 0; pass < 15; pass++) {
    for (let i = 1; i < REST.length - 1; i++) {
      REST[i] = [(REST[i - 1][0] + 2 * REST[i][0] + REST[i + 1][0]) / 4,
                 (REST[i - 1][1] + 2 * REST[i][1] + REST[i + 1][1]) / 4];
      REST_W[i] = (REST_W[i - 1] + 2 * REST_W[i] + REST_W[i + 1]) / 4;
    }
  }
  const REST_LEN = [], REST_ANG = [];
  for (let i = 0; i < REST.length - 1; i++) {
    const dx = REST[i + 1][0] - REST[i][0], dy = REST[i + 1][1] - REST[i][1];
    REST_LEN.push(Math.hypot(dx, dy));
    REST_ANG.push(Math.atan2(dy, dx));
  }
  const REST_S = [0];
  for (let i = 1; i < REST.length; i++) REST_S.push(REST_S[i - 1] + Math.hypot(REST[i][0] - REST[i - 1][0], REST[i][1] - REST[i - 1][1]));
  REST_S.forEach((v, i, arr) => { arr[i] = v / arr[arr.length - 1]; });

  const EAR_L = { apex: [712,140], pivot: [731,502] };
  const EAR_R = { apex: [1057,140], pivot: [1000,620] };
  const EYES = [
    { cx: 745,  cy: 658, r: 121, lid: document.getElementById('lidLPath'), el: document.getElementById('eyeL') },
    { cx: 1014, cy: 658, r: 100, lid: document.getElementById('lidRPath'), el: document.getElementById('eyeR') },
  ];

  // ---- State ----
  const S = {
    awake: 0,            // 0 = sleepy (original logo), 1 = fully awake
    excite: 0,           // tail energy boost from petting / hovering the tail
    happy: 0,            // 0..1 cheeks pushed up into a smiling squint
    happyUntil: 0, held: false,
    blink: 0,            // 0..1 lid closure from blinking
    pointer: null,       // pointer position in SVG units
    look: [0, 0],        // smoothed gaze direction (-1..1)
    lastMove: -1e9,
    earL: { t: 99, amp: 0 }, earR: { t: 99, amp: 0 },
    earLean: 0,
    blinkAt: 0, blinkStart: -1,
    nextTwitch: 2,
    lean: 0,             // 0..1 tail curled over to point at the cat's head
    leanUntil: 0, nextLean: 3,
  };

  const ease = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
  const rot = (p, c, a) => {
    const s = Math.sin(a), co = Math.cos(a), x = p[0] - c[0], y = p[1] - c[1];
    return [c[0] + x * co - y * s, c[1] + x * s + y * co];
  };
  const f = n => n.toFixed(1);

  function twitch(ear, strength = 1) { ear.t = 0; ear.amp = (0.08 + Math.random() * 0.05) * strength; }

  // ---- Tail: swish the smoothed spine, then outline it ----
  // "Wave action": the tail swings about a pivot near the joint and every
  // section repeats the pivot's angle about half a cycle later. Mid-sway the
  // base and tip point opposite ways, so the tail is an S (mirrored for each
  // direction); at each end, just before it reverses, it bows into a C; and
  // it cushions at each end (sine easing). The swing and the head-ward lean are spread
  // smoothly along the whole tail so every pose is one continuous curve.
  // Each section then chases its target angle through a spring that softens
  // toward the tip, which adds follow-through to every change of motion.
  // Rotating sections keeps the tail's length; the sway is even left and
  // right, except that beside the back it can't turn far toward the back.
  let tailPhase = 0, tailEdgeX = 277;
  const PIVOT_S = 0.17;                   // arc-length position of the swing's pivot
  const LAG = 3.0;                        // phase delay from the pivot to the tip (radians)
  const STRAIGHTEN = 0.85;                // how much of the logo's resting S gives way to the sway's own S
  // Beside the back the tail can only turn a little to the right (toward the
  // back); above the back it swings right as freely as left.
  const RIGHT_ROOM = SEG_U_OF => 0.2 + 0.8 * Math.min(Math.max((SEG_U_OF - 0.12) / 0.3, 0), 1) ** 2;
  const JOINT_Y = 775, BACK_X = 305;      // where the gap between tail and back ends
  const tailAng = REST_LEN.map(() => 0), tailVel = REST_LEN.map(() => 0);
  // Position along the swinging part (0 at the pivot, 1 at the tip) for each section.
  const SEG_U = REST_LEN.map((_, i) => Math.max(0, (REST_S[i + 1] - PIVOT_S) / (1 - PIVOT_S)));
  // The lean pose (from a design sketch): the tail rises from the base,
  // bulges left through the middle and hooks right at the top, pointing at
  // the head. Two cubic Béziers in viewBox units; only their direction along
  // the length is used, so the tail keeps its own length.
  const LEAN_POSE = [
    [[207,945], [245,760], [105,552], [140,361]],
    [[140,361], [165,219], [370,174], [418,174]],
  ];
  const LEAN_DIFF = (() => {
    const pts = [];
    LEAN_POSE.forEach(([p0, p1, p2, p3], k) => {
      for (let j = k ? 1 : 0; j <= 60; j++) {
        const t = j / 60, m = 1 - t;
        pts.push([0, 1].map(c => m*m*m*p0[c] + 3*m*m*t*p1[c] + 3*m*t*t*p2[c] + t*t*t*p3[c]));
      }
    });
    const len = [0];
    for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const total = len[len.length - 1];
    return REST_LEN.map((_, i) => {
      const want = (REST_S[i] + REST_S[i + 1]) / 2 * total;
      let j = 1; while (j < pts.length - 1 && len[j] < want) j++;
      const ang = Math.atan2(pts[j][1] - pts[j - 1][1], pts[j][0] - pts[j - 1][0]);
      let d = ang - REST_ANG[i];
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    });
  })();
  // Neutral pose for swaying: above the pivot the tail eases toward a straight
  // line from the pivot to the logo's tail tip, so the sway's S reads the same
  // in both directions instead of adding to or cancelling the logo's S.
  const NEUTRAL_DIFF = (() => {
    const pi = REST_S.findIndex(v => v >= PIVOT_S), tip = REST[REST.length - 1];
    const ang = Math.atan2(tip[1] - REST[pi][1], tip[0] - REST[pi][0]);
    return REST_ANG.map((ra, i) => {
      const t = Math.min(SEG_U[i] / 0.25, 1), ramp = t * t * (3 - 2 * t);
      return ramp * (ang - ra);
    });
  })();
  let tailSettled = false;
  function tailPath(dt) {
    const speed = 2.0 + 0.8 * S.awake + 2.8 * S.excite;    // radians per second
    tailPhase += speed * dt;
    // Swing amplitude in radians; quieter while the tail leans toward the cat.
    const amp = (0.3 + 0.08 * S.awake + 0.14 * S.excite) * (1 - 0.8 * S.lean);

    // Target angle offset for each section.
    const target = REST_LEN.map((len, i) => {
      const u = SEG_U[i];
      const spread = 1 - Math.pow(1 - u, 2.2);            // rotation builds up all the way to the tip
      let swing = amp * spread * Math.sin(tailPhase - LAG * u);
      if (swing > 0) swing *= RIGHT_ROOM(u);              // positive = turning right
      return swing + (1 - S.lean) * STRAIGHTEN * NEUTRAL_DIFF[i] + S.lean * LEAN_DIFF[i];
    });

    // Springs: stiff near the pivot, loose at the tip, slightly underdamped.
    if (!tailSettled) { target.forEach((v, i) => { tailAng[i] = v; }); tailSettled = true; }
    const SUB = 3, h = dt / SUB;
    for (let k = 0; k < SUB; k++) {
      target.forEach((v, i) => {
        const stiff = 30 + 170 * Math.pow(1 - REST_S[i + 1], 2);
        const damp = 2 * 0.6 * Math.sqrt(stiff);
        tailVel[i] += (stiff * (v - tailAng[i]) - damp * tailVel[i]) * h;
        tailAng[i] += tailVel[i] * h;
      });
    }

    // Light smoothing of the angles along the tail keeps the curve free of ripples.
    let ang = tailAng.slice();
    for (let pass = 0; pass < 4; pass++) {
      ang = ang.map((v, i) => i === 0 || i === ang.length - 1 ? v : (ang[i - 1] + 2 * v + ang[i + 1]) / 4);
    }
    const dense = [REST[0]];
    REST_LEN.forEach((len, i) => {
      const a = REST_ANG[i] + ang[i], prev = dense[i];
      dense.push([prev[0] + Math.cos(a) * len, prev[1] + Math.sin(a) * len]);
    });

    const a = [], b = [];
    normalsOf(dense).forEach((n, i) => {
      const p = dense[i], h = REST_W[i] / 2;
      a.push([p[0] + n[0] * h, p[1] + n[1] * h]);
      b.push([p[0] - n[0] * h, p[1] - n[1] * h]);
    });
    // Where the tail's back edge crosses the joint line, for the rounded joint.
    let best = Infinity;
    a.forEach(p => { const dy = Math.abs(p[1] - JOINT_Y); if (dy < best) { best = dy; tailEdgeX = p[0]; } });
    const r = WIDTHS[WIDTHS.length - 1] / 2;
    const end = b[b.length - 1];
    let d = 'M' + a.map(p => f(p[0]) + ',' + f(p[1])).join('L');
    d += `A${r},${r} 0 0 0 ${f(end[0])},${f(end[1])}`;
    for (let i = b.length - 2; i >= 0; i--) d += 'L' + f(b[i][0]) + ',' + f(b[i][1]);
    // Extend under the ground line so the base stays flush.
    return d + `L${f(b[0][0])},990L${f(a[0][0])},990Z`;
  }

  // ---- Ears: apexes rotate about a pivot; the rest of the body is fixed ----
  function earAngle(ear, dt) {
    ear.t += dt;
    return ear.amp * Math.exp(-ear.t * 5) * Math.sin(ear.t * 28);
  }

  function bodyPath(dt) {
    const lean = S.earLean;
    const l = rot(EAR_L.apex, EAR_L.pivot, -earAngle(S.earL, dt) + lean * 0.05);
    const r = rot(EAR_R.apex, EAR_R.pivot,  earAngle(S.earR, dt) + lean * 0.04);
    // The gap between tail and back ends in a round bottom that spans whatever
    // width the swaying tail leaves open.
    const gx = Math.min(tailEdgeX, BACK_X - 8), jr = (BACK_X - gx) / 2;
    return `M200,990L200,${JOINT_Y}L${f(gx)},${JOINT_Y}A${f(jr)},${f(jr)} 0 0 0 ${BACK_X},${JOINT_Y}` +
           `C330,620 430,517 575,517` +
           `L${f(l[0])},${f(l[1])}L888,487L${f(r[0])},${f(r[1])}L1250,990Z`;
  }

  // ---- Eyes: a flat top lid and a curved cheek clip a white disc ----
  // Sleepy shows the logo's half-moon; happy lifts the top lid and pushes the
  // cheek up into a smiling squint. The whole eye drifts toward the pointer.
  function drawEyes() {
    const h = S.happy;
    EYES.forEach(e => {
      const x0 = e.cx - e.r - 6, x1 = e.cx + e.r + 6, low = e.cy + e.r + 6;
      // Cheek: a dome rising from below, sloping down toward the cat's right.
      const yL = low + (e.cy + 0.02 * e.r - low) * h;
      const yR = low + (e.cy + 0.25 * e.r - low) * h;
      const cY = low + (e.cy - 0.42 * e.r - low) * h;
      const cX = e.cx - 0.15 * e.r;
      const open = S.awake * 0.3 + (1 - S.awake * 0.3) * h;  // 0 = the logo's half-moon
      let lidY = e.cy - open * (e.r + 2);
      const shut = Math.min(yL, yR) - 2;
      lidY = Math.min(lidY + (low - lidY) * S.blink, shut); // blink closes down onto the cheek
      e.lid.setAttribute('d', `M${f(x0)},${f(lidY)}H${f(x1)}V${f(yR)}Q${f(cX)},${f(cY)} ${f(x0)},${f(yL)}Z`);
      e.el.setAttribute('transform', `translate(${f(S.look[0] * 14)},${f(S.look[1] * 6)})`);
    });
  }

  // ---- Input ----
  function toSvg(ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  addEventListener('pointermove', ev => {
    const p = toSvg(ev);
    S.pointer = [p.x, p.y];
    S.lastMove = performance.now() / 1000;
  });
  document.addEventListener('pointerleave', () => { S.pointer = null; });

  function pet() {
    S.excite = 1;
    S.lastMove = performance.now() / 1000;
    twitch(S.earL, 1.6); twitch(S.earR, 1.6);
    S.happyUntil = performance.now() / 1000 + 1.6;
  }
  svg.addEventListener('pointerdown', ev => {
    ev.preventDefault(); // no focus ring on mouse clicks
    S.held = true;
  });
  addEventListener('pointerup', () => { S.held = false; });
  addEventListener('pointercancel', () => { S.held = false; });
  svg.addEventListener('click', pet);
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pet(); }
  });

  // ---- Loop ----
  let last = performance.now() / 1000;
  function frame(nowMs) {
    const now = nowMs / 1000;
    const dt = Math.min(now - last, 0.05);
    last = now;

    const idle = now - S.lastMove;
    S.awake = ease(S.awake, idle < 4 ? 1 : 0, idle < 4 ? 6 : 1.2, dt);

    // Hovering near the tail gets it going.
    let tailTarget = 0;
    if (S.pointer && S.pointer[0] < 420 && S.pointer[1] > 100 && S.pointer[1] < 945 && idle < 1) tailTarget = 0.7;
    S.excite = ease(S.excite, tailTarget, S.excite > tailTarget ? 0.9 : 4, dt);

    // Petting (or holding the pointer down on the cat) brings out the cheeks.
    const happyTarget = S.held || now < S.happyUntil ? 1 : 0;
    S.happy = ease(S.happy, happyTarget, happyTarget ? 9 : 3, dt);

    // Gaze toward the pointer, relative to the face centre.
    let gx = 0, gy = 0;
    if (S.pointer && idle < 4) {
      const dx = S.pointer[0] - 880, dy = S.pointer[1] - 680;
      const m = Math.hypot(dx, dy) || 1, k = Math.min(m / 350, 1);
      gx = dx / m * k; gy = dy / m * k;
    }
    S.look[0] = ease(S.look[0], gx, 10, dt);
    S.look[1] = ease(S.look[1], gy, 10, dt);
    S.earLean = ease(S.earLean, gx, 3, dt);

    // Blinks while awake.
    if (S.awake > 0.6 && S.happy < 0.1 && now > S.blinkAt) {
      S.blinkStart = now;
      S.blinkAt = now + 2 + Math.random() * 4;
    }
    const bt = (now - S.blinkStart) / 0.18;
    S.blink = bt >= 0 && bt < 2 ? (bt < 1 ? bt : 2 - bt) : 0;

    // Random ear flicks, more often when awake.
    // Now and then the tail sways over and points toward the cat, then lets go.
    S.nextLean -= dt;
    if (S.nextLean <= 0) {
      S.leanUntil = now + 1.4 + Math.random() * 1.6;
      S.nextLean = 5 + Math.random() * 6;
    }
    S.lean = ease(S.lean, now < S.leanUntil ? 1 : 0, now < S.leanUntil ? 2.2 : 1.6, dt);

    S.nextTwitch -= dt;
    if (S.nextTwitch <= 0) {
      twitch(Math.random() < 0.5 ? S.earL : S.earR);
      S.nextTwitch = (S.awake > 0.5 ? 1.5 : 4) + Math.random() * 4;
    }

    tailEl.setAttribute('d', tailPath(dt));
    bodyEl.setAttribute('d', bodyPath(dt));
    drawEyes();
    if (!reduceMotion) requestAnimationFrame(frame);
  }

  if (reduceMotion) {
    // Static logo; still let the eyes follow and petting redraw once.
    const redraw = () => frame(performance.now());
    addEventListener('pointermove', redraw);
    svg.addEventListener('click', redraw);
    redraw();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
