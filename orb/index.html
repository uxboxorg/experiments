<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Orb</title>
<style>
  :root { --bg: #000; --ink: #e8e8e8; --hint: #7a7a7a; --line: #262626; --chip: #121212; --on: #f2f2f2; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: 1fr auto auto;
    overflow: hidden;
  }
  #stage { position: relative; min-height: 0; }
  #orb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #label {
    position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
    color: var(--hint); user-select: none; letter-spacing: .02em;
  }
  #label b { color: var(--ink); font-weight: 500; }
  .chat { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px 16px 0; color: var(--hint); }
  #mini { width: 40px; height: 40px; display: block; }
  nav {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 16px; border-top: 1px solid var(--line); margin-top: 12px;
  }
  nav button {
    font: inherit; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  nav button[aria-pressed="true"] { background: var(--on); color: #000; border-color: var(--on); }
  nav button:focus-visible { outline: 2px solid var(--hint); outline-offset: 2px; }
  nav .sep { width: 1px; background: var(--line); margin: 0 4px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="orb" role="img" aria-label="AI status orb"></canvas>
  <div id="label" aria-live="polite"></div>
</div>
<div class="chat"><canvas id="mini" aria-hidden="true"></canvas><span id="miniText"></span></div>
<nav id="states"></nav>

<script src="orb.js"></script>
<script>
(() => {
  const orbs = [
    ThinkingOrb.create(document.getElementById('orb')),
    ThinkingOrb.create(document.getElementById('mini')),
  ];
  const STATES = ThinkingOrb.states;
  const nav = document.getElementById('states');
  const labelEl = document.getElementById('label');
  const miniText = document.getElementById('miniText');
  const buttons = {};
  let active = 'idle';

  function setState(name) {
    for (const o of orbs) o.setState(name);
    if (STATES[name]) active = name;
    updateUI();
  }

  for (const [name, s] of Object.entries(STATES)) {
    const b = document.createElement('button');
    b.textContent = s.label;
    b.title = s.hint;
    b.onclick = () => { stopDemo(); setState(name); };
    nav.append(b);
    buttons[name] = b;
  }
  nav.append(Object.assign(document.createElement('span'), { className: 'sep' }));
  const doneBtn = document.createElement('button');
  doneBtn.textContent = 'Done ✓';
  doneBtn.title = 'One-shot reaction when a task finishes';
  doneBtn.onclick = () => setState('success');
  const demoBtn = document.createElement('button');
  demoBtn.textContent = 'Demo';
  demoBtn.title = 'Play a typical conversation turn';
  nav.append(doneBtn, demoBtn);

  function updateUI() {
    for (const [n, b] of Object.entries(buttons)) b.setAttribute('aria-pressed', String(n === active));
    demoBtn.setAttribute('aria-pressed', String(demoTimer != null));
    const s = STATES[active];
    labelEl.innerHTML = `<b>${s.label}</b> · ${s.hint}`;
    miniText.textContent = active === 'idle' ? 'Assistant' : `Assistant is ${s.label.toLowerCase()}…`;
  }

  // A typical turn: user types, model thinks, searches, uses tools, answers.
  const SCRIPT = [
    ['idle', 2500], ['listening', 3500], ['thinking', 5200], ['researching', 6000],
    ['thinking', 3000], ['working', 5000], ['typing', 6000], ['success', 0], ['idle', 2200],
    ['waiting', 4000], ['error', 2500],
  ];
  let demoTimer = null;
  function runDemo(i = 0) {
    const [name, ms] = SCRIPT[i % SCRIPT.length];
    setState(name);
    demoTimer = setTimeout(() => runDemo(i + 1), ms);
    updateUI();
  }
  function stopDemo() { clearTimeout(demoTimer); demoTimer = null; updateUI(); }
  demoBtn.onclick = () => demoTimer != null ? stopDemo() : runDemo();

  window.orb = { setState, setLevel: v => orbs.forEach(o => o.setLevel(v)) };

  const initial = new URLSearchParams(location.search).get('state');
  if (STATES[initial]) setState(initial); else runDemo();
})();
</script>
</body>
</html>
